[project]
name = "pdal"
description = "Point cloud data processing"
readme = "README.rst"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
keywords = ["point", "cloud", "spatial"]
authors = [
  {email = "howard@hobu.co"},
  {name = "Howard Butler"}
]
maintainers = [
  {name = "Howard Butler", email = "howard@hobu.co"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "numpy >= 1.24"
]

dynamic = ["version"]

[project.optional-dependencies]
test = [
  "geopandas",
  "meshio >= 5.3",
  "pandas >= 2",
  "pytest >= 8",
]

[project.urls]
homepage = "https://pdal.org"
documentation = "https://pdal.org"
repository = "https://github.com/PDAL/Python"
changelog = "https://github.com/PDAL/python/blob/main/README.rst"

[build-system]
requires = [
  "scikit-build-core >= 1.0",
  "numpy >= 2.0",
  "pybind11[global] >= 2.12",
]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
sdist.exclude = [
  ".github",
  "**/__pycache__/**",
  "**/*.pyc",
]
sdist.cmake = false
sdist.inclusion-mode = "explicit"
cmake.build-type = "Release"
sdist.include = [
  "CHANGES.txt",
  "CMakeLists.txt",
  "LICENSE.txt",
  "pyproject.toml",
  "README.rst",
  "src",
]
wheel.packages = ["src/pdal"]
wheel.exclude = [
  "pdal/*.cpp",
  "pdal/*.hpp",
  "pdal/export.hpp",
  "**/__pycache__/**",
  "**/*.pyc",
]
build.verbose = false
logging.level = "ERROR"

[tool.uv]
no-build-isolation = true

[tool.uv.pip]
no-build-isolation = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "src/pdal/__init__.py"
